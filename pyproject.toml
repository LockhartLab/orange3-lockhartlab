[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orange3-lockhartlab"
version = "0.11.0"
description = "Lockhart Lab widgets for Orange: protein and DNA/RNA sequence features (simple properties, k-mers), class-balanced model training and feature-set comparison."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Orange3>=3.34", "biopython>=1.80"]
keywords = ["orange3 add-on", "bioinformatics", "protein", "dna", "sequence", "imbalanced", "resampling"]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/LockhartLab/orange3-lockhartlab"
Download = "https://github.com/LockhartLab/orange3-lockhartlab/releases/latest"

[project.entry-points."orange3.addon"]
seqprops = "orangecontrib.seqprops"

[project.entry-points."orange.widgets"]
"Lockhart Lab" = "orangecontrib.seqprops.widgets"

[tool.setuptools.packages.find]
include = ["orangecontrib*"]
namespaces = true

[tool.setuptools.package-data]
"orangecontrib.seqprops.widgets" = ["icons/*.svg"]
