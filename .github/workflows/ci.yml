name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # Students use Orange on Windows and macOS; Orange 3.40 ships Python 3.12.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
      - name: Install the wheel the way Orange would (plus Qt for the tests)
        shell: bash
        run: python -m pip install dist/*.whl PyQt6 PyQt6-WebEngine
      - name: Run the tests against the installed copy
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m unittest
          orangecontrib.seqprops.widgets.tests.test_properties
          orangecontrib.seqprops.widgets.tests.test_owsequenceproperties
          orangecontrib.seqprops.widgets.tests.test_owbalance
          orangecontrib.seqprops.widgets.tests.test_owkmers
          orangecontrib.seqprops.widgets.tests.test_owcomparefeaturesets

  release:
    # Runs only for version tags like v0.6.0, after the tests pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version in pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
      - name: Create the GitHub release with the wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "$GITHUB_REF_NAME" \
            --notes "Students: download the .whl file below and drag it onto Orange's Options → Add-ons… window. Full instructions: https://github.com/${{ github.repository }}#install-it"
