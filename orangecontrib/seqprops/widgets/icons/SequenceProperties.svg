<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Base pairs in Sanger chromatogram colors: A green, C blue, G black, T red -->
  <!-- A-T -->
  <rect x="6" y="11" width="7" height="13" rx="1.5" fill="#1b9e3e"/>
  <rect x="6" y="24" width="7" height="13" rx="1.5" fill="#d62728"/>
  <!-- C-G -->
  <rect x="16" y="11" width="7" height="13" rx="1.5" fill="#1f5fbf"/>
  <rect x="16" y="24" width="7" height="13" rx="1.5" fill="#202020"/>
  <!-- G-C -->
  <rect x="26" y="11" width="7" height="13" rx="1.5" fill="#202020"/>
  <rect x="26" y="24" width="7" height="13" rx="1.5" fill="#1f5fbf"/>
  <!-- T-A -->
  <rect x="36" y="11" width="7" height="13" rx="1.5" fill="#d62728"/>
  <rect x="36" y="24" width="7" height="13" rx="1.5" fill="#1b9e3e"/>
  <!-- sugar-phosphate backbones -->
  <path d="M3 9 Q13 5 24 9 T45 9" fill="none" stroke="#5f6b73" stroke-width="3" stroke-linecap="round"/>
  <path d="M3 39 Q13 43 24 39 T45 39" fill="none" stroke="#5f6b73" stroke-width="3" stroke-linecap="round"/>
</svg>
